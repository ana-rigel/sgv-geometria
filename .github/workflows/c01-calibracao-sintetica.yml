name: SGV-C01 - Calibracao matematica sintetica
on:
  push:
    branches: [research/hdr-fisher-entropia-controle-sintetico]
    paths:
      - 'experiments/c01_oraculo_hdr_fisher.py'
      - 'scripts/c01_portao1_calibrar.py'
      - 'tests/test_c01_oraculo.py'
      - 'tests/test_c01_instrumentacao.py'
      - '.github/workflows/c01-calibracao-sintetica.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fase1-sintetica:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias numericas
        run: python -m pip install numpy scipy scikit-image trimesh pytest
      - name: Testes matematicos C01
        run: python -m pytest -q tests/test_c01_oraculo.py tests/test_c01_instrumentacao.py
      - name: Portao de precisao HDR50 e HDR95
        run: python scripts/c01_portao1_calibrar.py --out reports/c01_portao1_calibracao.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: C01-fase1-calibracao-sintetica
          path: reports/c01_portao1_calibracao.json
          if-no-files-found: warn
