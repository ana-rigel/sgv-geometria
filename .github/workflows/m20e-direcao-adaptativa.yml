name: SGV-M20e - Direcao adaptativa causal (somente sintetico)
on:
  push:
    branches: [research/m20e-direcao-adaptativa]
    paths:
      - 'experiments/m20e_direcao_adaptativa.py'
      - 'tests/test_m20e_direcao_adaptativa.py'
      - 'scripts/m20e_agregar.py'
      - 'tests/test_m20e_agregar.py'
      - 'reports/PROTOCOLO_SGV_M20e_20261011.md'
      - '.github/workflows/m20e-direcao-adaptativa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  piloto:
    name: Gates de software e piloto de engenharia
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest
      - name: Testes de vazamento e integridade
        run: python -m pytest -q tests/test_m20e_direcao_adaptativa.py tests/test_m20e_agregar.py
      - name: Piloto engenharia (seed disjunta; sem ajuste cientifico)
        run: python experiments/m20e_direcao_adaptativa.py --mode pilot
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SGV-M20e-piloto
          path: reports/m20e/pilot.json
          if-no-files-found: warn
          retention-days: 90
  shards:
    needs: piloto
    name: M20e cenario ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        scenario: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy
      - name: 64 trajetorias x 19 referencias prefix-only
        run: python experiments/m20e_direcao_adaptativa.py --mode full --scenario ${{ matrix.scenario }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SGV-M20e-shard-${{ matrix.scenario }}
          path: reports/m20e/shard_*.json
          if-no-files-found: error
          retention-days: 90
  agregar:
    needs: [piloto, shards]
    if: ${{ always() && needs.piloto.result == 'success' }}
    name: Consolidar ensaios e portoes congelados
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install scipy
      - uses: actions/download-artifact@v4
        with:
          pattern: SGV-M20e-shard-*
          path: reports/m20e/_download
          merge-multiple: true
      - name: Agregacao fail-closed
        run: python scripts/m20e_agregar.py --shards reports/m20e/_download --out reports/m20e/analise.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SGV-M20e-analise
          path: reports/m20e/analise.json
          if-no-files-found: warn
          retention-days: 90
