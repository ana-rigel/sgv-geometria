name: SGV - Validacao streaming real
on:
  push:
    branches: [research/streaming-real-observacional]
    paths:
      - 'experiments/validar_stream_real.py'
      - 'tests/test_validar_stream_real.py'
      - '.github/workflows/streaming-real-observacional.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unitarios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scipy pytest websocket-client
      - name: Testes de integridade fechada e da classe incremental
        run: python -m pytest -q tests/test_validar_stream_real.py tests/test_stream_fotografia.py
  live:
    needs: unitarios
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scipy websocket-client
      - name: Capturar 2 candles fechados de ETHUSDT spot e comparar com REST
        run: python experiments/validar_stream_real.py --symbol ETHUSDT --seconds 220 --min-closed 2 --window 120
      - name: Publicar evidencias inclusive caso falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SGV-streaming-real-ETHUSDT
          path: reports/STREAM_REAL_ETHUSDT.json
          if-no-files-found: warn
