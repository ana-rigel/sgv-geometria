name: SGV Integracao Preflight (sem dados de mercado)
on:
  push:
    branches:
      - research/integracao-m11i-u03-rtt-m35
    paths:
      - 'tests/test_integracao_pesquisa.py'
      - 'tests/test_m35_retomar_lotes.py'
      - 'scripts/m35_retomar_lotes.py'
      - 'reports/SGV_PROGRAMA_INTEGRADO_M11I_U03_M35_RTT_20261013.md'
      - 'experiments/m35_instrumento.py'
      - '.github/workflows/sgv-integracao-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Instalar dependencias numericas e de superficie
        run: python -m pip install numpy pandas scipy scikit-learn matplotlib pytest scikit-image trimesh
      - name: Verificar as regras de integracao
        run: python -m pytest -q tests/test_integracao_pesquisa.py
      - name: Testar M35 apenas com distribuições sinteticas
        run: python -m pytest -q tests/test_m35_instrumento.py
      - name: Testar particionamento e retomada M35 sem BTC
        run: python -m pytest -q tests/test_m35_retomar_lotes.py
      - name: Execucao real de dois cenarios sinteticos M35 (apenas smoke)
        run: |
          python scripts/m35_retomar_lotes.py --stage synthetic --shard 0 --shards 30 --out /tmp/m35_synthetic_smoke.json
          python -c "import json; x=json.load(open('/tmp/m35_synthetic_smoke.json')); assert x['stage']=='synthetic' and len(x['rows'])==2"
      - name: Arquivos confirmatorios nao sao acessados
        run: |
          echo "Somente testes sinteticos e leitura do registro versionado."
          echo "Nenhum script de download, nenhum alvo de mercado ou holdout foi executado."
