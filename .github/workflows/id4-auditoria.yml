name: SGV-ID4 - Auditoria somente leitura do teste consumido
on:
  push:
    branches: [research/identificabilidade-4d-memoria-direcional-20261015]
    paths: [".github/workflows/id4-auditoria.yml"]
permissions:
  contents: write
jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - name: Conferir perdas, hashes e bootstrap sem simulacao
        run: python scripts/id4_auditoria_independente.py --out resultados/id4_auditoria_somente_leitura.json
      - name: Preservar auditoria sem abrir ou recriar holdout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -f resultados/id4_auditoria_somente_leitura.json
          git commit -m "audit(ID4): conferência independente do teste consumido [skip ci]"
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ID4-auditoria-read-only
          path: resultados/id4_auditoria_somente_leitura.json
          if-no-files-found: warn
