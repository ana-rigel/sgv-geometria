name: Confirmatório H-σRTT-01

on:
  push:
    branches: ["confirmatorio/H-sigmaRTT-01"]
    paths: [".github/workflows/confirmatorio-sigma.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: confirmatorio-sigma
  cancel-in-progress: false

jobs:
  julgar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip freeze > versoes_runner.txt

      - name: Conferir hashes do pré-registro
        run: sha256sum -c referencia/HASHES_PREREGISTRO.txt

      - name: Ensaio de paridade em junho–julho (antes de abrir o reservado)
        run: |
          mkdir -p resultados
          python pipeline/confirmatorio_sigma.py --periodo exploracao | tee resultados/ensaio_paridade.log
          python - <<'PY'
          import json, sys
          import numpy as np
          a = json.load(open("resultados/H-sigmaRTT-01_exploracao.json"))["series"]["real"]
          b = json.load(open("referencia/H-sigmaRTT-01_exploracao_referencia.json"))["series"]["real"]
          d = float(np.max(np.abs(np.array(a) - np.array(b))))
          print(f"diferença máxima do σ real diário contra a referência: {d:.2e}")
          sys.exit(0 if d < 1e-3 else 1)
          PY

      - name: Baixar e conferir agosto–setembro/2026
        run: |
          base=https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1m
          for m in 2026-08 2026-09; do
            f=BTCUSDT-1m-$m.zip
            curl -fsSL --retry 3 -o dados/$f "$base/$f"
            curl -fsSL --retry 3 -o dados/$f.CHECKSUM "$base/$f.CHECKSUM"
            (cd dados && sha256sum -c $f.CHECKSUM)
          done

      - name: Julgamento
        run: python pipeline/confirmatorio_sigma.py --periodo confirmatorio | tee resultados/julgamento.log

      - name: Gravar resultado no ramo
        if: always()
        run: |
          cp versoes_runner.txt resultados/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -f resultados/ || true
          git commit -m "Resultado H-σRTT-01 (run ${{ github.run_id }})" || echo "nada para gravar"
          git push || true
