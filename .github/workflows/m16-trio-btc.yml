name: SGV-M16 - Tres reguas no BTC exploratorio
on:
  push:
    branches: [research/m16-trio-btc-exploratorio]
    paths:
      - 'experiments/m16_trio_btc_exploratorio.py'
      - 'tests/test_m16_trio_btc_exploratorio.py'
      - 'scripts/m16_agregar.py'
      - '.github/workflows/m16-trio-btc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  piloto:
    name: Testes + plano (84/18 origens) + piloto de engenharia
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pandas scikit-learn scikit-image trimesh hmmlearn pytest
      - name: Somente klines exploratorias com SHA-256
        run: python scripts/baixar_klines.py
      - run: python -m pytest -q tests/test_m16_trio_btc_exploratorio.py tests/test_m15_forma_persistencia_comparadores.py
      - run: python experiments/m16_trio_btc_exploratorio.py --mode plan
      - run: python experiments/m16_trio_btc_exploratorio.py --mode pilot
  shards:
    needs: piloto
    name: M16 ${{ matrix.interval }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {interval: 1m, shard: 0}
          - {interval: 1m, shard: 1}
          - {interval: 1m, shard: 2}
          - {interval: 1m, shard: 3}
          - {interval: 1m, shard: 4}
          - {interval: 1m, shard: 5}
          - {interval: 1m, shard: 6}
          - {interval: 1m, shard: 7}
          - {interval: 1m, shard: 8}
          - {interval: 1m, shard: 9}
          - {interval: 1m, shard: 10}
          - {interval: 1m, shard: 11}
          - {interval: 1m, shard: 12}
          - {interval: 1m, shard: 13}
          - {interval: 1m, shard: 14}
          - {interval: 1m, shard: 15}
          - {interval: 1m, shard: 16}
          - {interval: 1m, shard: 17}
          - {interval: 1m, shard: 18}
          - {interval: 1m, shard: 19}
          - {interval: 1m, shard: 20}
          - {interval: 1h, shard: 0}
          - {interval: 1h, shard: 1}
          - {interval: 1h, shard: 2}
          - {interval: 1h, shard: 3}
          - {interval: 1h, shard: 4}
          - {interval: 1h, shard: 5}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pandas scikit-learn scikit-image trimesh hmmlearn
      - run: python scripts/baixar_klines.py --so ${{ matrix.interval }}
      - run: python experiments/m16_trio_btc_exploratorio.py --mode shard --interval ${{ matrix.interval }} --shard ${{ matrix.shard }}
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'SGV-M16-shard-${{ matrix.interval }}-${{ matrix.shard }}', path: 'reports/m16/shard_*.json', if-no-files-found: warn, retention-days: 90}
  consolidacao:
    needs: [piloto, shards]
    if: ${{ always() && needs.piloto.result == 'success' }}
    name: Agregar e publicar na branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pandas scikit-learn scikit-image trimesh hmmlearn
      - uses: actions/download-artifact@v4
        with: {pattern: 'SGV-M16-shard-*', path: reports/m16/shards, merge-multiple: true}
      - name: Agregar (falha fechada se faltar qualquer origem)
        run: python scripts/m16_agregar.py --shards reports/m16/shards --out reports/m16
      - name: Commit dos resultados
        if: always()
        run: |
          git config user.name "sgv-m16-bot"
          git config user.email "sgv-m16-bot@users.noreply.github.com"
          git add -f reports/m16 || true
          git commit -m "results: M16 three-ruler audit of N0-N3 on exploratory BTC [skip ci]" || echo "nada a commitar"
          git push
