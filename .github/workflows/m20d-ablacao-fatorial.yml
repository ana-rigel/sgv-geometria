name: SGV-M20d - Ablacao fatorial 2x2x2 (somente sintetico)
on:
  push:
    branches: [research/m20d-ablacao-fatorial]
    paths:
      - 'experiments/m20d_ablacao_fatorial.py'
      - 'tests/test_m20d_ablacao_fatorial.py'
      - 'scripts/m20d_agregar.py'
      - 'tests/test_m20d_agregar.py'
      - 'reports/PROTOCOLO_SGV_M20d_20261011.md'
      - '.github/workflows/m20d-ablacao-fatorial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  piloto:
    name: Testes e piloto de engenharia (sem ajustes pos-resultados)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest
      - name: Portao dos testes matematicos e de integridade
        run: python -m pytest -q tests/test_m20d_ablacao_fatorial.py tests/test_m20d_agregar.py
      - name: Piloto separado (2 trials por cenario)
        run: python experiments/m20d_ablacao_fatorial.py --mode pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SGV-M20d-piloto
          path: reports/m20d/piloto_engenharia.json
          retention-days: 90
          if-no-files-found: warn
  cenarios:
    needs: piloto
    name: M20d cenario ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scenario: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy
      - name: 64 trials x oito celulas pareadas (mesma trajetoria)
        run: python experiments/m20d_ablacao_fatorial.py --mode full --scenario ${{ matrix.scenario }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SGV-M20d-shard-${{ matrix.scenario }}
          path: reports/m20d/shard_*.json
          retention-days: 90
          if-no-files-found: error
  consolidacao:
    needs: [piloto, cenarios]
    if: ${{ always() && needs.piloto.result == 'success' }}
    name: Consolidar 320 trials independentes e testar hipoteses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy
      - uses: actions/download-artifact@v4
        with:
          pattern: SGV-M20d-shard-*
          path: reports/m20d/_download
          merge-multiple: true
      - name: Agregacao fail-closed com efeitos pareados e bootstrap de trials
        run: python scripts/m20d_agregar.py --shards reports/m20d/_download --out reports/m20d/analise.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SGV-M20d-analise
          path: reports/m20d/analise.json
          retention-days: 90
          if-no-files-found: warn
