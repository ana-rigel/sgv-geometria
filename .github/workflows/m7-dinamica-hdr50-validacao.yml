name: SGV-M7 - Dinamica geometrica HDR50
on:
  push:
    branches: [research/m7-dinamica-hdr50-validacao]
    paths:
      - 'experiments/m7_dinamica_hdr50_validacao.py'
      - 'tests/test_m7_dinamica_hdr50_validacao.py'
      - '.github/workflows/m7-dinamica-hdr50-validacao.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibracao:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pandas scikit-learn scikit-image trimesh pytest
      - name: Testar causalidade, HDR e pareamento
        run: python -m pytest -q tests/test_m7_dinamica_hdr50_validacao.py
      - name: Calibrar execucao sintetica
        run: python experiments/m7_dinamica_hdr50_validacao.py --interval synthetic
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SGV-M7-calibracao
          path: reports/SGV_M7_synthetic.json
          if-no-files-found: warn
  replay:
    needs: calibracao
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        interval: [1m, 1h]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pandas scikit-learn scikit-image trimesh
      - name: Baixar apenas BTC exploratorio com checksum
        run: python scripts/baixar_klines.py --so ${{ matrix.interval }}
      - name: Testar dinamica HDR50 em origens pareadas
        run: python experiments/m7_dinamica_hdr50_validacao.py --interval ${{ matrix.interval }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SGV-M7-BTC-${{ matrix.interval }}
          path: |
            reports/SGV_M7_${{ matrix.interval }}.json
            reports/SGV_M7_${{ matrix.interval }}_errors.csv
          if-no-files-found: warn
