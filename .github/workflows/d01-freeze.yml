name: SGV-D01 - Treino e freeze sem ago-set
on:
  push:
    branches: [research/sgv-d01-direcao-ago-set-20261015]
    paths: [".github/workflows/d01-freeze.yml", "tests/test_sgv_d01_direcao.py"]
permissions:
  contents: write
concurrency:
  group: sgv-d01-freeze
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: "."
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - name: Controles de causalidade ANTES de treinar
        run: python -m pytest -q tests/test_sgv_d01_direcao.py
      - name: Ajustar modelos em sinteticos IDs 0-11 e BTC somente jun-jul com ancora maio
        run: |
          python pipeline/sgv_d01_direcao.py --stage train \
             --freeze resultados/d01_modelos_congelados.json \
             --out resultados/d01_nao_usado.json
          sha256sum resultados/d01_modelos_congelados.json
      - name: Preservar modelos antes de qualquer teste em ago-set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -f resultados/d01_modelos_congelados.json
          git commit -m "freeze(D01): tres modelos BTC ate julho e controles sinteticos sem teste [skip ci]"
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D01-modelos-congelados
          path: resultados/d01_modelos_congelados.json
          if-no-files-found: warn
