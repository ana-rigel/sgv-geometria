name: Exploração E-VOL-01 (vol implícita Deribit × D(x), jun–jul/2026)

on:
  push:
    branches: ["exploracao/vol-implicita"]
    paths: [".github/workflows/vol-implicita.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Baixar Deribit (DVOL 1 min + negócios de opções com IV), mai–jul/2026
        run: python vol_implicita/baixar_deribit.py --inicio 2026-05-01 --fim 2026-08-01 | tee vol_implicita/resultados/baixar.log
      - name: Rodar E-VOL-01
        run: python vol_implicita/vol_implicita.py | tee vol_implicita/resultados/E-VOL-01.log
      - name: Gravar resultado no ramo
        if: always()
        run: |
          ls -la vol_implicita/dados || true
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -f vol_implicita/resultados/
          git commit -m "Resultado E-VOL-01 (run ${{ github.run_id }})" || echo "nada"
          git push || true
