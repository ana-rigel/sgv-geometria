name: SGV-AMB01 - Teste sintético único e agosto setembro exploratorio
on:
  push:
    branches: [research/sgv-amb01-memoria-ambiental-20261015]
    paths: [".github/workflows/amb01-avaliacao-unica.yml"]
permissions:
  contents: write
concurrency:
  group: amb01-heldout-once
  cancel-in-progress: false
jobs:
  heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: "."
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar requirements
        run: python -m pip install -r requirements.txt pytest
      - name: Preflight apenas IDs desenvolvimento; validar blobs congelados
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_sgv_amb01_memoria_ambiental.py
          test "$(git hash-object reports/AMB01_PROTOCOLO_20261015.md)" = "4e9a5a4b08e561ec660f4a23509cc6b93114f3cc"
          test "$(git hash-object pipeline/sgv_amb01_memoria_ambiental.py)" = "b90f1ba2e3e4151094a9b79c8b76f96401fb1163"
          test "$(git hash-object tests/test_sgv_amb01_memoria_ambiental.py)" = "784481f7a7ce141fb04f7b50ab9acac3690a40b2"
          test "$(git hash-object resultados/amb01_modelos_congelados.json)" = "a1c4f58e7a85a8b4f6c1062a7ff9a870a9356f40"
          test ! -f resultados/amb01_TEST_RELEASE.txt
          test ! -f resultados/amb01_synthetic_final.json
          test ! -f resultados/amb01_btc_agoset_exploratorio.json
          sha256sum resultados/amb01_modelos_congelados.json
      - name: Registrar única liberação sintética antes de criar os casos 12-19
        run: |
          set -euo pipefail
          echo "AMB01 RELEASED 2026-10-15: synthetic IDs12-19 one time; source blob b90f1ba2e3e4151094a9b79c8b76f96401fb1163; models blob a1c4f58e7a85a8b4f6c1062a7ff9a870a9356f40" > resultados/amb01_TEST_RELEASE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -f resultados/amb01_TEST_RELEASE.txt
          git commit -m "holdout(AMB01): liberar oito controles sinteticos somente uma vez [skip ci]"
          git pull --rebase
          git push
      - name: Executar oito controles sintéticos congelados (sem abrir BTC)
        id: sint
        continue-on-error: true
        run: |
          set -euo pipefail
          model_sha=$(sha256sum resultados/amb01_modelos_congelados.json | awk '{print $1}')
          python pipeline/sgv_amb01_memoria_ambiental.py --stage synthetic \
            --freeze resultados/amb01_modelos_congelados.json \
            --freeze-sha "$model_sha" \
            --out resultados/amb01_synthetic_final.json | tee resultados/amb01_synthetic_final.log
          test -s resultados/amb01_synthetic_final.json
      - name: Conferir que sintético gerou JSON válido (independente de gates)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('resultados/amb01_synthetic_final.json'))
          assert d['status'] in ('PASS_SYNTHETIC_AMB01','FAIL_SYNTHETIC_AMB01')
          print('synthetic_status:',d['status'])
          print('gates:',d['synthetics']['gates'])
          PY
      - name: Baixar somente AGO-SET e verificar SHA256 oficial
        run: |
          set -euo pipefail
          base=https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1m
          for month in 2026-08 2026-09; do
            file=BTCUSDT-1m-$month.zip
            curl -fsSL --retry 3 -o dados/$file "$base/$file"
            curl -fsSL --retry 3 -o dados/$file.CHECKSUM "$base/$file.CHECKSUM"
            (cd dados && sha256sum -c $file.CHECKSUM)
          done
      - name: Avaliar agosto-setembro SEM reajuste e sem usar outubro novembro
        run: |
          set -euo pipefail
          model_sha=$(sha256sum resultados/amb01_modelos_congelados.json | awk '{print $1}')
          python pipeline/sgv_amb01_memoria_ambiental.py --stage market \
            --freeze resultados/amb01_modelos_congelados.json \
            --freeze-sha "$model_sha" \
            --out resultados/amb01_btc_agoset_exploratorio.json | tee resultados/amb01_btc_agoset.log
          test -s resultados/amb01_btc_agoset_exploratorio.json
      - name: Preservar resultados separadamente, nunca mascarar erro com tee
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          for p in resultados/amb01_synthetic_final.json resultados/amb01_synthetic_final.log resultados/amb01_btc_agoset_exploratorio.json resultados/amb01_btc_agoset.log; do
            if [ -f "$p" ]; then git add -f "$p"; fi
          done
          git commit -m "results(AMB01): controles e BTC historico [skip ci]" || true
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AMB01-teste-unico-e-BTC-exploratorio
          path: |
            resultados/amb01_TEST_RELEASE.txt
            resultados/amb01_synthetic_final.json
            resultados/amb01_synthetic_final.log
            resultados/amb01_btc_agoset_exploratorio.json
            resultados/amb01_btc_agoset.log
          if-no-files-found: warn
