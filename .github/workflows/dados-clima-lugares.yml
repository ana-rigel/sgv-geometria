name: Dados de clima dos lugares do teste 31 (só download)

on:
  push:
    branches: ["ia-geometrica/v0"]
    paths: [".github/workflows/dados-clima-lugares.yml", "ia-geometrica/clima/baixar_lugares.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados-clima-lugares
  cancel-in-progress: false

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar os dez lugares (ERA5-Land e ERA5 via Open-Meteo)
        run: |
          set -o pipefail
          python ia-geometrica/clima/baixar_lugares.py | tee ia-geometrica/clima/download_lugares.log
      - name: Gravar no ramo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -f ia-geometrica/clima/dados/lugares ia-geometrica/clima/download_lugares.log || true
          git commit -m "Dados dos lugares do teste 31 baixados (run ${{ github.run_id }}); só download" || echo "nada para gravar"
          git pull --rebase -q || true
          git push || true
