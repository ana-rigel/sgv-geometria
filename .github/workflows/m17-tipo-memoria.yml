name: SGV-M17 - Tipo de memoria do BTC
on:
  push:
    branches: [research/m17-tipo-de-memoria]
    paths:
      - 'experiments/m17_tipo_de_memoria.py'
      - 'tests/test_m17_tipo_de_memoria.py'
      - 'scripts/m17_agregar.py'
      - '.github/workflows/m17-tipo-memoria.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  piloto:
    name: Testes + piloto de engenharia (84/18 origens travadas)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pandas scikit-learn scikit-image trimesh hmmlearn pytest
      - name: Somente klines exploratorias com SHA-256
        run: python scripts/baixar_klines.py
      - run: python -m pytest -q tests/test_m17_tipo_de_memoria.py tests/test_m15_forma_persistencia_comparadores.py
      - run: python experiments/m17_tipo_de_memoria.py --mode pilot
  shards:
    needs: piloto
    name: M17 ${{ matrix.interval }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {interval: 1m, shard: 0}
          - {interval: 1m, shard: 1}
          - {interval: 1m, shard: 2}
          - {interval: 1m, shard: 3}
          - {interval: 1m, shard: 4}
          - {interval: 1m, shard: 5}
          - {interval: 1m, shard: 6}
          - {interval: 1m, shard: 7}
          - {interval: 1m, shard: 8}
          - {interval: 1m, shard: 9}
          - {interval: 1m, shard: 10}
          - {interval: 1m, shard: 11}
          - {interval: 1m, shard: 12}
          - {interval: 1m, shard: 13}
          - {interval: 1m, shard: 14}
          - {interval: 1m, shard: 15}
          - {interval: 1m, shard: 16}
          - {interval: 1m, shard: 17}
          - {interval: 1m, shard: 18}
          - {interval: 1m, shard: 19}
          - {interval: 1m, shard: 20}
          - {interval: 1m, shard: 21}
          - {interval: 1m, shard: 22}
          - {interval: 1m, shard: 23}
          - {interval: 1m, shard: 24}
          - {interval: 1m, shard: 25}
          - {interval: 1m, shard: 26}
          - {interval: 1m, shard: 27}
          - {interval: 1m, shard: 28}
          - {interval: 1m, shard: 29}
          - {interval: 1m, shard: 30}
          - {interval: 1m, shard: 31}
          - {interval: 1m, shard: 32}
          - {interval: 1m, shard: 33}
          - {interval: 1m, shard: 34}
          - {interval: 1m, shard: 35}
          - {interval: 1m, shard: 36}
          - {interval: 1m, shard: 37}
          - {interval: 1m, shard: 38}
          - {interval: 1m, shard: 39}
          - {interval: 1m, shard: 40}
          - {interval: 1m, shard: 41}
          - {interval: 1h, shard: 0}
          - {interval: 1h, shard: 1}
          - {interval: 1h, shard: 2}
          - {interval: 1h, shard: 3}
          - {interval: 1h, shard: 4}
          - {interval: 1h, shard: 5}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pandas scikit-learn scikit-image trimesh hmmlearn
      - run: python scripts/baixar_klines.py --so ${{ matrix.interval }}
      - run: python experiments/m17_tipo_de_memoria.py --mode shard --interval ${{ matrix.interval }} --shard ${{ matrix.shard }}
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'SGV-M17-shard-${{ matrix.interval }}-${{ matrix.shard }}', path: 'reports/m17/shard_*.json', if-no-files-found: warn, retention-days: 90}
  consolidacao:
    needs: [piloto, shards]
    if: ${{ always() && needs.piloto.result == 'success' }}
    name: Agregar e publicar na branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pandas scikit-learn scikit-image trimesh hmmlearn
      - uses: actions/download-artifact@v4
        with: {pattern: 'SGV-M17-shard-*', path: reports/m17/shards, merge-multiple: true}
      - name: Agregar (falha fechada se faltar qualquer origem)
        run: python scripts/m17_agregar.py --shards reports/m17/shards --out reports/m17
      - name: Commit dos resultados
        if: always()
        run: |
          git config user.name "sgv-m17-bot"
          git config user.email "sgv-m17-bot@users.noreply.github.com"
          git add -f reports/m17 || true
          git commit -m "results: M17 memory-type audit on exploratory BTC [skip ci]" || echo "nada a commitar"
          git push
