name: SGV-M9 — Simetrias e Registro 3D
on:
  push:
    branches: [research/m9-simetrias-registro-3d]
    paths:
      - 'experiments/m9_registro_simetrico_3d.py'
      - 'tests/test_m9_registro_simetrico_3d.py'
      - '.github/workflows/m9-registro-simetrico-3d.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibracao:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pandas scikit-learn scikit-image trimesh pytest
      - name: Validar simetrias, holdout e malhas sinteticas
        run: python -m pytest -q tests/test_m9_registro_simetrico_3d.py
      - name: Calibracao matematica M9
        run: python experiments/m9_registro_simetrico_3d.py --interval synthetic
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SGV-M9-calibracao
          path: reports/SGV_M9_synthetic.json
          if-no-files-found: warn
  btc:
    needs: calibracao
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        interval: [1m, 1h]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pandas scikit-learn scikit-image trimesh
      - name: Baixar apenas BTC exploratorio com checksums
        run: python scripts/baixar_klines.py --so ${{ matrix.interval }}
      - name: Validar movimentos M9 contra SF1 M5 M6
        run: python experiments/m9_registro_simetrico_3d.py --interval ${{ matrix.interval }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SGV-M9-BTC-${{ matrix.interval }}
          path: |
            reports/SGV_M9_${{ matrix.interval }}.json
            reports/SGV_M9_${{ matrix.interval }}_metrics.csv
          if-no-files-found: warn
