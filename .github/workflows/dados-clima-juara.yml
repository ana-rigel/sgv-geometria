name: Dados de clima de Juara (teste 30, só download)

on:
  push:
    branches: ["ia-geometrica/v0"]
    paths: [".github/workflows/dados-clima-juara.yml", "ia-geometrica/clima/baixar_dados.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados-clima-juara
  cancel-in-progress: false

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar ERA5-Land (Open-Meteo) e INMET (Juara)
        run: |
          set -o pipefail
          python ia-geometrica/clima/baixar_dados.py | tee ia-geometrica/clima/download.log

      - name: Gravar os dados no ramo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -f ia-geometrica/clima/dados ia-geometrica/clima/download.log || true
          git commit -m "Dados de clima de Juara baixados (run ${{ github.run_id }}); só download, nenhum valor lido" || echo "nada para gravar"
          git pull --rebase -q || true
          git push || true
