name: SGV M34 - hipotese acoplamento geometrico-dinamico
on:
  push:
    branches: [research/m34-acoplamento-geometrico-dinamico]
    paths:
      - 'sgv_m34/**'
      - 'sgv_m11i/instrument.py'
      - 'tests/test_m34_acoplamento.py'
      - 'requirements_m34.txt'
      - '.github/workflows/m34-acoplamento.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic_only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements_m34.txt
      - run: python -m pytest -q tests/test_m34_acoplamento.py
      - run: python -m sgv_m34.cli --mode synthetic --out reports/m34_synthetic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M34-synthetic-only
          path: reports/m34_synthetic.json
          retention-days: 30
