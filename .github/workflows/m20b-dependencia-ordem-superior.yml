name: SGV-M20b - Dependencia temporal nao linear (somente sintetico)
on:
  push:
    branches: [research/m20b-dependencia-alem-segunda-ordem]
    paths:
      - 'experiments/m20b_dependencia_ordem_superior.py'
      - 'tests/test_m20b_dependencia_ordem_superior.py'
      - 'reports/PROTOCOLO_SGV_M20b_20261011.md'
      - '.github/workflows/m20b-dependencia-ordem-superior.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sintetico:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pytest
      - name: Testes matematicos e de simulacao
        run: python -m pytest -q tests/test_m20b_dependencia_ordem_superior.py
      - name: Piloto de engenharia com seed independente
        run: python experiments/m20b_dependencia_ordem_superior.py --mode pilot
      - name: Ensaio pre-registrado sem dados de BTC
        run: python experiments/m20b_dependencia_ordem_superior.py --mode full
      - name: Imprimir numeradores e criterios
        run: |
          python - <<'PY'
          import json
          r=json.load(open('reports/m20b/resultados_sinteticos.json'))
          print('GATES',json.dumps(r['gates']))
          print('ALL_GATES_PASS',r['all_gates_pass'])
          for group,d in r['groups'].items():
              print(group, [(name, v['alarms'], v['n'], v['rate'])
                            for name,v in d.items()])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SGV-M20b-ensaio-sintetico
          path: reports/m20b/*.json
          retention-days: 90
          if-no-files-found: warn
