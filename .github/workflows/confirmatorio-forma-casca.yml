name: Confirmatório H-FORMA-D-02

on:
  workflow_dispatch:   # só manual: nenhum push lê outubro ou novembro
    inputs:
      periodo:
        description: "confirmatorio (outubro/2026) ou replicacao (novembro/2026)"
        required: true
        type: choice
        options: [confirmatorio, replicacao]

permissions:
  contents: write

concurrency:
  group: confirmatorio-forma-casca
  cancel-in-progress: false

jobs:
  julgar:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip freeze > versoes_runner_forma_casca.txt

      - name: Conferir hashes do pré-registro H-FORMA-D-02
        run: sha256sum -c referencia/HASHES_H-FORMA-D-02.txt

      - name: Ensaio de paridade em junho–julho (antes de abrir o reservado)
        run: |
          mkdir -p resultados
          python pipeline/confirmatorio_forma_casca.py --periodo exploracao | tee resultados/ensaio_paridade_forma_casca.log
          python - <<'PY'
          import json, sys
          import numpy as np
          a = json.load(open("resultados/H-FORMA-D-02_exploracao.json"))
          b = json.load(open("referencia/H-FORMA-D-02_exploracao_referencia.json"))
          d = 0.0
          for sp in ("flow", "orig"):
              for chave in ("serie_real", "serie_nula0"):
                  for k in ("dFD", "dFS", "angD", "angS"):
                      x = np.array(a["espacos"][sp][chave][k], float); y = np.array(b["espacos"][sp][chave][k], float)
                      d = max(d, float(np.nanmax(np.abs(x - y))))
                      if not np.array_equal(np.isnan(x), np.isnan(y)): d = max(d, 1.0)
          ra = [a["primaria"]["rho_real"]] + a["primaria"]["rho_nula_replicas"]
          rb = [b["primaria"]["rho_real"]] + b["primaria"]["rho_nula_replicas"]
          d = max(d, float(np.max(np.abs(np.array(ra) - np.array(rb)))))
          print(f"diferença máxima contra a referência (séries e ρ da primária): {d:.2e}")
          sys.exit(0 if d < 2e-6 else 1)
          PY

      - name: "Baixar e conferir os meses depois de julho (só o necessário para o período escolhido)"
        run: |
          base=https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1m
          meses="2026-08 2026-09 2026-10"
          if [ "${{ inputs.periodo }}" = "replicacao" ]; then meses="$meses 2026-11"; fi
          for m in $meses; do
            f=BTCUSDT-1m-$m.zip
            curl -fsSL --retry 3 -o dados/$f "$base/$f"
            curl -fsSL --retry 3 -o dados/$f.CHECKSUM "$base/$f.CHECKSUM"
            (cd dados && sha256sum -c $f.CHECKSUM)
          done

      - name: Julgamento
        run: python pipeline/confirmatorio_forma_casca.py --periodo ${{ inputs.periodo }} | tee resultados/julgamento_forma_casca_${{ inputs.periodo }}.log

      - name: Gravar o resultado no ramo
        if: always()
        run: |
          cp versoes_runner_forma_casca.txt resultados/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -f resultados/ || true
          git commit -m "Resultado H-FORMA-D-02 (${{ inputs.periodo }}, run ${{ github.run_id }})" || echo "nada para gravar"
          git push || true
