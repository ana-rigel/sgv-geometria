name: Painel de replay 4D (exportar maio–setembro/2026)

on:
  push:
    branches: ["painel/replay-4d"]
    paths: [".github/workflows/painel-replay.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: "Baixar e conferir agosto e setembro/2026 (outubro não é lido)"
        run: |
          base=https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1m
          for m in 2026-08 2026-09; do
            f=BTCUSDT-1m-$m.zip
            curl -fsSL --retry 3 -o dados/$f "$base/$f"
            curl -fsSL --retry 3 -o dados/$f.CHECKSUM "$base/$f.CHECKSUM"
            (cd dados && sha256sum -c $f.CHECKSUM)
          done
      - name: Exportar maio–setembro
        run: python -W ignore painel/exportar_replay.py --meses 2026-05 2026-06 2026-07 2026-08 2026-09
      - name: Gravar no ramo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -f painel/dados/replay_2026-05_2026-09.* || true
          git commit -m "Painel de replay: dados maio–setembro (run ${{ github.run_id }})" || echo "nada para gravar"
          git push || true
