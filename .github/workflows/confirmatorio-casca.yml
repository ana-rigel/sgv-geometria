name: Confirmatório H-CASCA-01 (LTCUSDT)

on:
  push:
    paths: [".github/workflows/confirmatorio-casca.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: confirmatorio-casca
  cancel-in-progress: false

jobs:
  julgar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Julgamento único (não roda de novo se já houver resultado)
        run: |
          if [ -f resultados/H-CASCA-01_LTCUSDT_julgamento.json ]; then echo "Já julgado"; exit 1; fi

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip freeze > versoes_runner_casca.txt

      - name: Conferir hashes do pré-registro H-CASCA-01
        run: sha256sum -c referencia/HASHES_H-CASCA-01.txt

      - name: Ensaio de paridade em BTC junho–julho
        run: |
          set -o pipefail
          mkdir -p resultados
          python -W ignore pipeline/confirmatorio_casca.py --paridade-btc | tee resultados/H-CASCA-01_paridade.log

      - name: Baixar e conferir LTCUSDT maio–setembro/2026
        run: |
          base=https://data.binance.vision/data/spot/monthly/klines/LTCUSDT/1m
          for m in 2026-05 2026-06 2026-07 2026-08 2026-09; do
            f=LTCUSDT-1m-$m.zip
            curl -fsSL --retry 3 -o dados/$f "$base/$f"
            curl -fsSL --retry 3 -o dados/$f.CHECKSUM "$base/$f.CHECKSUM"
            (cd dados && sha256sum -c $f.CHECKSUM)
          done

      - name: Julgamento
        run: |
          set -o pipefail
          python -W ignore pipeline/confirmatorio_casca.py --simbolo LTCUSDT | tee resultados/H-CASCA-01_julgamento.log

      - name: Publicar resultado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add resultados/H-CASCA-01_* versoes_runner_casca.txt dados/LTCUSDT-1m-*.CHECKSUM || true
          git commit -m "H-CASCA-01: julgamento LTCUSDT jun–set/2026 (gerado pelo runner)" || exit 0
          git push
