name: SGV-M32 - Curvatura da casca (SOL 1m, disparo por arquivo)
on:
  push:
    branches: [research/m32-curvatura-casca]
    paths: ['reports/m32/disparo.json']
permissions:
  contents: write
jobs:
  m32:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env: {OPENBLAS_NUM_THREADS: '2', OMP_NUM_THREADS: '2'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pandas scikit-learn scikit-image trimesh pytest
      - name: Testes
        run: python -m pytest -q tests/test_m32_casca.py tests/test_m32_confirmatorio.py
      - name: Confirmatorio (SOLUSDT 1m 2026-05..09)
        run: python experiments/m32_confirmatorio.py --mode confirmatorio --protocol-sha "$(python -c "import json;print(json.load(open('reports/m32/disparo.json'))['protocol_sha'])")"
      - name: Commit
        if: always()
        run: |
          git config user.name "sgv-m32-bot"
          git config user.email "sgv-m32-bot@users.noreply.github.com"
          git add -f reports/m32/m32_confirmatorio.json reports/m32/SGV_M32_CONFIRMATORIO.md reports/m32/m32_confirmatorio_previsoes.csv.gz || true
          git commit -m "results: M32 confirmatory (SOL 1m) [skip ci]" || echo "nada a commitar"
          git push
