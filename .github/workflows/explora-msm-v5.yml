name: Exploração MSM v5, volume na observação (jun–jul e ago–set/2026)

on:
  push:
    branches: ["exploracao/msm"]
    paths: [".github/workflows/explora-msm-v5.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: explora-msm-v5
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        periodo: [junjul, agoset]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: "Baixar e conferir agosto e setembro/2026 (outubro não é lido)"
        if: matrix.periodo == 'agoset'
        run: |
          base=https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1m
          for m in 2026-08 2026-09; do
            f=BTCUSDT-1m-$m.zip
            curl -fsSL --retry 3 -o dados/$f "$base/$f"
            curl -fsSL --retry 3 -o dados/$f.CHECKSUM "$base/$f.CHECKSUM"
            (cd dados && sha256sum -c $f.CHECKSUM)
          done
      - name: Rodar
        run: |
          mkdir -p resultados
          set -o pipefail
          python -W ignore pipeline/explora_msm_v5.py --periodo ${{ matrix.periodo }} | tee resultados/msm_v5_${{ matrix.periodo }}.log
      - name: Gravar o resultado no ramo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -f resultados/msm_v5_${{ matrix.periodo }}.json resultados/msm_v5_${{ matrix.periodo }}.log || true
          git commit -m "Exploração MSM v5: resultado ${{ matrix.periodo }} (run ${{ github.run_id }})" || echo "nada para gravar"
          git pull --rebase origin exploracao/msm || true
          git push || true
