name: SGV-M20c - Acoplamentos condicionais x HSIC (somente sintetico)
on:
  push:
    branches: [research/m20c-acoplamento-condicional]
    paths:
      - 'experiments/m20c_acoplamento_condicional.py'
      - 'tests/test_m20c_acoplamento_condicional.py'
      - 'scripts/m20c_agregar.py'
      - 'reports/PROTOCOLO_SGV_M20c_20261011.md'
      - '.github/workflows/m20c-acoplamentos-condicionais.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  piloto:
    name: Portao matematico e piloto somente de engenharia
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest
      - name: Testes unitarios previos
        run: python -m pytest -q tests/test_m20c_acoplamento_condicional.py tests/test_m20b_dependencia_ordem_superior.py
      - name: Piloto isolado nao usado para alterar hipotese
        run: python experiments/m20c_acoplamento_condicional.py --mode pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SGV-M20c-piloto-engenharia
          path: reports/m20c/piloto_engenharia.json
          if-no-files-found: warn
          retention-days: 90
  cenarios:
    needs: piloto
    name: M20c cenario ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scenario: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy
      - name: 80 trials independentes prefix-only e 19 referencias
        run: python experiments/m20c_acoplamento_condicional.py --mode full --scenario ${{ matrix.scenario }} --outdir reports/m20c
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SGV-M20c-shard-${{ matrix.scenario }}
          path: reports/m20c/shard_*.json
          if-no-files-found: error
          retention-days: 90
  consolidacao:
    needs: [piloto, cenarios]
    if: ${{ always() && needs.piloto.result == 'success' }}
    name: Consolidacao auditavel de todas as 400 trajetorias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy
      - uses: actions/download-artifact@v4
        with:
          pattern: SGV-M20c-shard-*
          merge-multiple: true
          path: reports/m20c/_download
      - name: Rejeitar shards faltantes, duplicados ou incompletos
        run: python scripts/m20c_agregar.py --shards reports/m20c/_download --out reports/m20c/analise.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SGV-M20c-analise-consolidada
          path: reports/m20c/analise.json
          if-no-files-found: warn
          retention-days: 90
