name: SGV - Precisao da forma tridimensional
on:
  push:
    branches: [research/precisao-forma-3d]
    paths:
      - 'experiments/precisao_formas_3d.py'
      - 'tests/test_precisao_formas_3d.py'
      - '.github/workflows/precisao-forma-3d.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibracao:
    name: Testes e controles 3D
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pandas scikit-learn pytest
      - name: Validar HDR 3D, causalidade e bootstrap
        run: python -m pytest -q tests/test_precisao_formas_3d.py
      - name: Calibracao controles sinteticos e SF1
        run: python experiments/precisao_formas_3d.py --interval synthetic
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgv-forma-3d-sintetico
          path: reports/FORMA_3D_synthetic.json
          if-no-files-found: warn
  exploratorio:
    needs: calibracao
    name: BTC 3D ${{ matrix.interval }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        interval: [1m, 1h]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pandas scikit-learn
      - name: Baixar exclusivamente exploracao com checksum
        run: python scripts/baixar_klines.py --so ${{ matrix.interval }}
      - name: Reconstruir 3D e estimar incerteza por blocos
        run: python experiments/precisao_formas_3d.py --interval ${{ matrix.interval }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgv-forma-3d-${{ matrix.interval }}
          path: |
            reports/FORMA_3D_${{ matrix.interval }}.json
            reports/FORMA_3D_${{ matrix.interval }}_janelas.csv
          if-no-files-found: warn
