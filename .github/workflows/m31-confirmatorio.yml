name: SGV-M31 - Forma vs econometria (ETH 1m, disparo por arquivo)
on:
  push:
    branches: [research/m31g1-engenharia]
    paths: ['reports/m31/disparo.json']
permissions:
  contents: write
jobs:
  m31:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env: {OPENBLAS_NUM_THREADS: '2', OMP_NUM_THREADS: '2'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pandas scikit-learn scikit-image trimesh pytest
      - name: Testes
        run: python -m pytest -q tests/test_m31g1_engenharia.py tests/test_m31_confirmatorio.py
      - name: Confirmatorio (ETHUSDT 1m 2026-05..09)
        run: python experiments/m31_confirmatorio.py --mode confirmatorio --protocol-sha "$(python -c "import json;print(json.load(open('reports/m31/disparo.json'))['protocol_sha'])")"
      - name: Commit
        if: always()
        run: |
          git config user.name "sgv-m31-bot"
          git config user.email "sgv-m31-bot@users.noreply.github.com"
          git add -f reports/m31/m31_confirmatorio.json reports/m31/SGV_M31_CONFIRMATORIO.md reports/m31/m31_confirmatorio_previsoes.csv.gz || true
          git commit -m "results: M31 confirmatory (ETH 1m) [skip ci]" || echo "nada a commitar"
          git push
