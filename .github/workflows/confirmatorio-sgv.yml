name: "Confirmatório H-SGV-01 (só funciona depois do congelamento)"

on:
  workflow_dispatch:   # só manual: nenhum push lê outubro ou novembro
    inputs:
      periodo:
        description: "confirmatorio (out: julga a) · replicacao (nov: replica a) · conjunto (out+nov: julga b) · replicacao_b (dez: replica b)"
        required: true
        type: choice
        options: [confirmatorio, replicacao, conjunto, replicacao_b]

permissions:
  contents: write

concurrency:
  group: confirmatorio-sgv
  cancel-in-progress: false

jobs:
  julgar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip freeze > versoes_runner_sgv.txt

      - name: Conferir hashes do pré-registro H-SGV-01
        run: sha256sum -c referencia/HASHES_H-SGV-01.txt

      - name: Ensaio de paridade em junho–julho (antes de abrir o reservado)
        run: |
          mkdir -p resultados
          python pipeline/confirmatorio_sgv.py --periodo exploracao | tee resultados/ensaio_paridade_sgv.log
          python - <<'PY'
          import json, sys
          import numpy as np
          a = json.load(open("resultados/H-SGV-01_exploracao.json"))["medidas"]
          b = json.load(open("referencia/H-SGV-01_exploracao_referencia.json"))["medidas"]
          d = max(float(np.max(np.abs(np.array(a[m]["rho_semanal"]) - np.array(b[m]["rho_semanal"])))) for m in a)
          print(f"diferença máxima dos ρ semanais contra a referência: {d:.2e}")
          sys.exit(0 if d < 1e-6 else 1)
          PY

      - name: "Baixar e conferir os meses depois de julho (só o necessário para o período escolhido)"
        run: |
          base=https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1m
          meses="2026-08 2026-09 2026-10"
          case "${{ inputs.periodo }}" in
            replicacao|conjunto) meses="$meses 2026-11" ;;
            replicacao_b) meses="$meses 2026-11 2026-12" ;;
          esac
          for m in $meses; do
            f=BTCUSDT-1m-$m.zip
            curl -fsSL --retry 3 -o dados/$f "$base/$f"
            curl -fsSL --retry 3 -o dados/$f.CHECKSUM "$base/$f.CHECKSUM"
            (cd dados && sha256sum -c $f.CHECKSUM)
          done

      - name: Julgamento
        run: python pipeline/confirmatorio_sgv.py --periodo ${{ inputs.periodo }} | tee resultados/julgamento_sgv_${{ inputs.periodo }}.log

      - name: Gravar o resultado no ramo
        if: always()
        run: |
          cp versoes_runner_sgv.txt resultados/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -f resultados/ || true
          git commit -m "Resultado H-SGV-01 (${{ inputs.periodo }}, run ${{ github.run_id }})" || echo "nada para gravar"
          git push || true
