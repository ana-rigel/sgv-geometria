name: SGV-M20f - Kernels invariantes a rotacao (somente sintetico)
on:
  push:
    branches: [research/m20f-kernels-invariantes]
    paths:
      - 'experiments/m20f_kernels_invariantes.py'
      - 'tests/test_m20f_kernels_invariantes.py'
      - 'scripts/m20f_agregar.py'
      - 'tests/test_m20f_agregar.py'
      - 'reports/PROTOCOLO_SGV_M20f_20261011.md'
      - '.github/workflows/m20f-kernels-invariantes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  piloto:
    name: Testes de invariancia, causalidade e engenharia
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy scipy pytest
      - name: Testar invariancia matematica e limites de uso
        run: python -m pytest -q tests/test_m20f_kernels_invariantes.py tests/test_m20f_agregar.py
      - name: Piloto engenharia distinto dos 320 trials
        run: python experiments/m20f_kernels_invariantes.py --mode pilot
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SGV-M20f-piloto
          path: reports/m20f/piloto.json
          if-no-files-found: warn
          retention-days: 90
  shards:
    needs: piloto
    name: M20f cenario ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        scenario: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy
      - name: 64 trials independentes x 19 referencias prefix-only
        run: python experiments/m20f_kernels_invariantes.py --mode full --scenario ${{ matrix.scenario }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SGV-M20f-shard-${{ matrix.scenario }}
          path: reports/m20f/shard_*.json
          if-no-files-found: error
          retention-days: 90
  consolidacao:
    needs: [piloto, shards]
    if: ${{ always() && needs.piloto.result == 'success' }}
    name: Agregacao auditavel e julgamentos cientificos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install scipy
      - uses: actions/download-artifact@v4
        with:
          pattern: SGV-M20f-shard-*
          path: reports/m20f/_download
          merge-multiple: true
      - name: Recusar shard faltante, duplicado ou inconsistente
        run: python scripts/m20f_agregar.py --shards reports/m20f/_download --out reports/m20f/analise.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SGV-M20f-analise
          path: reports/m20f/analise.json
          if-no-files-found: warn
          retention-days: 90
