name: Reproduzir Fase 1 e faixa do G2.3
on:
  push:
    branches: [sgv-operavel]
    paths:
      - 'sgv_operavel/**'
      - 'scripts/**'
      - '.github/workflows/reproduzir-fase1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reproduzir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Baixar klines 1h e funding (2020-01 a 2026-07)
        run: python scripts/baixar_dados_fase1.py
      - name: Reproduzir a Fase 1 e calcular a faixa do G2.3
        run: python scripts/reproduzir_fase1.py
      - name: Gravar o relatório no ramo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/fase1_reproducao.json
          git commit -m "reports: reprodução da Fase 1 e faixa do G2.3 (Actions run ${{ github.run_id }})" || echo "sem mudanças"
          git push
